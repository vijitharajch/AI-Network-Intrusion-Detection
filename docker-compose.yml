services:
  backend:
    build: ./docker/backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: sqlite:///./nids.db
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - ./backend:/app
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
    depends_on: [backend]
